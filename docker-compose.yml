services:
  postgres:
    image: postgres:16-alpine
    container_name: wavy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wavy
    ports:
      - "5433:5432"
    volumes:
      - wavy_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wavy"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  wavy_pgdata:
